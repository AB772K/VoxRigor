[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxrigor"
version = "0.1.0.dev0"
description = "An open-source framework for reproducible security testing of voice authentication systems."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
authors = [{ name = "AB772K" }]
keywords = ["voice-biometrics", "security-research", "speaker-verification", "presentation-attack-detection", "authentication-security"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "jsonschema>=4.22,<5",
  "ruff>=0.6,<1",
  "mypy>=1.10,<2",
]

[project.scripts]
voxrigor = "voxrigor.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["voxrigor"]
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["voxrigor"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85

[tool.setuptools.package-data]
voxrigor = ["py.typed"]
